name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warehouse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_ENDPOINT_URL: http://127.0.0.1:4566
      ENVIRONMENT: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run local:configure
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: python -m pip install cfn-lint==1.58.0
      - run: cfn-lint infra/service.json infra/registry.json
      - run: docker compose config --quiet
      - run: docker compose up -d --wait localstack
      - run: npm run test:integration
      - run: docker compose up -d --build --wait api publisher worker
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Collect emulator logs
        if: failure()
        run: docker compose logs --no-color localstack api publisher worker
      - name: Stop local services
        if: always()
        run: docker compose down
